<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Thanks for stopping by">
<title>Thanks for stopping by</title>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.in { opacity: 0; animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
@keyframes in {
  from { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
}
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .55; }
  70%  { transform: scale(3.2); opacity: 0; }
  100% { transform: scale(3.2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; }
}

.train120 { animation: ride120 18s linear 1s infinite; }
@keyframes ride120 { from { transform: translateX(1260px); } to { transform: translateX(-120px); } }</style>

<text x="600.0" y="52" text-anchor="middle" class="sans in" font-size="22" fill="#ededed">Thanks for stopping by.</text>
<text x="600.0" y="84" text-anchor="middle" class="mono in" style="animation-delay:120ms" font-size="15" fill="#8f8f8f">made with care in Navarre</text>
<g class="in" style="animation-delay:240ms">
<defs>
  <linearGradient id="trail120" x1="1" x2="0" y1="0" y2="0">
    <stop offset="0" stop-color="#ededed" stop-opacity="0"/>
    <stop offset="1" stop-color="#ededed" stop-opacity=".9"/>
  </linearGradient>
  <clipPath id="clip120"><rect x="0" y="110" width="1200" height="20"/></clipPath>
</defs>

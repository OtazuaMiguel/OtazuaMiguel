<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="About">
<title>About</title>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.in { opacity: 0; animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
@keyframes in {
  from { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
}
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .55; }
  70%  { transform: scale(3.2); opacity: 0; }
  100% { transform: scale(3.2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; }
}

.draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.6s cubic-bezier(0.23, 1, 0.32, 1) 200ms forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }</style>

<text x="8" y="40" class="mono in" font-size="18" fill="#8f8f8f">01 <tspan fill="#262626">/</tspan> <tspan fill="#ededed">about</tspan></text>
<line class="draw" x1="136" y1="34" x2="1192" y2="34" stroke="#262626" stroke-width="1"/>

</svg>

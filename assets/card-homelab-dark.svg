<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Homelab — Network-wide ad blocking with Pi-hole and custom lists, plus self-hosting experiments on a Raspberry Pi.">
<title>Homelab — Network-wide ad blocking with Pi-hole and custom lists, plus self-hosting experiments on a Raspberry Pi.</title>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.in { opacity: 0; animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
@keyframes in {
  from { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
}
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .55; }
  70%  { transform: scale(3.2); opacity: 0; }
  100% { transform: scale(3.2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; }
}
</style>


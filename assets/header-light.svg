<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Otazua — Data Science &amp; Business Administration student at UPNA">
<title>Otazua — Data Science &amp; Business Administration student at UPNA</title>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.in { opacity: 0; animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
@keyframes in {
  from { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
}
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .55; }
  70%  { transform: scale(3.2); opacity: 0; }
  100% { transform: scale(3.2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; }
}

.word { opacity: 0; transform-box: fill-box; animation: word 10.4s cubic-bezier(0.23, 1, 0.32, 1) infinite both; }
@keyframes word {
  0%   { opacity: 0; transform: translateY(6px); filter: blur(4px); }
  4%   { opacity: 1; transform: translateY(0);   filter: blur(0); }
  22%  { opacity: 1; transform: translateY(0);   filter: blur(0); }
  25%  { opacity: 0; transform: translateY(-6px); filter: blur(4px); }
  100% { opacity: 0; }
}
.caret { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.train352 { animation: ride352 14s linear 0s infinite; }
@keyframes ride352 { from { transform: translateX(-120px); } to { transform: translateX(1148px); } }</style>

<defs>

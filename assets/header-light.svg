    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="m"><rect width="1200" height="400" fill="url(#fade)"/></mask>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="398" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="398" rx="20" fill="#fafafa" stroke="#e4e4e4"/>
<g clip-path="url(#card)"><rect width="1200" height="400" fill="url(#dots)" mask="url(#m)"/></g>


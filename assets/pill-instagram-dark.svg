<svg xmlns="http://www.w3.org/2000/svg" width="200" height="52" viewBox="0 0 200 52" role="img" aria-label="Instagram">
<title>Instagram</title>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.in { opacity: 0; animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
@keyframes in {
  from { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
}
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .55; }
  70%  { transform: scale(3.2); opacity: 0; }
  100% { transform: scale(3.2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; }
}
</style>

<g class="in" style="animation-delay:80ms">
<rect x="1" y="1" width="198" height="50" rx="25.0" fill="#0a0a0a" stroke="#262626"/>
<text x="92.0" y="32" text-anchor="middle" class="sans" font-size="17" font-weight="500" fill="#ededed">Instagram</text>
<text x="145.4" y="32" text-anchor="start" class="sans" font-size="16" fill="#8f8f8f">↗</text>
</g>
</svg>

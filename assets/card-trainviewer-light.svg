<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="TrainViewer — Real-time map of Spain's rail network: live trains on real tracks, official Adif incidents and station boards.">
<title>TrainViewer — Real-time map of Spain's rail network: live trains on real tracks, official Adif incidents and station boards.</title>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.in { opacity: 0; animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
@keyframes in {
  from { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
}
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .55; }
  70%  { transform: scale(3.2); opacity: 0; }
  100% { transform: scale(3.2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; }
}
</style>

<rect x="1" y="1" width="598" height="338" rx="18" fill="#fafafa" stroke="#e4e4e4"/>
<text x="44" y="62" class="mono in" style="animation-delay:0ms" font-size="14" fill="#6b6b6b">01</text>
<g class="in" style="animation-delay:60ms">
  <circle class="pulse" cx="508.4" cy="57" r="3.5" fill="#111111"/>
  <circle cx="508.4" cy="57" r="3.5" fill="#111111"/>
  <text x="556" y="62" text-anchor="end" class="mono" font-size="14" fill="#6b6b6b">Live</text>
</g>
<text x="42" y="126" class="sans in" style="animation-delay:120ms" font-size="36" font-weight="600" letter-spacing="-1.2" fill="#111111">TrainViewer</text>
<g class="in" style="animation-delay:200ms"><text x="44" y="168" class="sans" font-size="18" fill="#6b6b6b">Real-time map of Spain's rail network:</text><text x="44" y="196" class="sans" font-size="18" fill="#6b6b6b">live trains on real tracks, official Adif</text><text x="44" y="224" class="sans" font-size="18" fill="#6b6b6b">incidents and station boards.</text></g>
<g class="in" style="animation-delay:320ms"><rect x="44" y="270" width="106" height="30" rx="15" fill="#ffffff" stroke="#e4e4e4"/><text x="97.0" y="290" text-anchor="middle" class="mono" font-size="13" fill="#6b6b6b">JavaScript</text></g><g class="in" style="animation-delay:380ms"><rect x="158.0" y="270" width="83" height="30" rx="15" fill="#ffffff" stroke="#e4e4e4"/><text x="199.3" y="290" text-anchor="middle" class="mono" font-size="13" fill="#6b6b6b">Leaflet</text></g><g class="in" style="animation-delay:440ms"><rect x="248.6" y="270" width="90" height="30" rx="15" fill="#ffffff" stroke="#e4e4e4"/><text x="293.8" y="290" text-anchor="middle" class="mono" font-size="13" fill="#6b6b6b">Supabase</text></g><g class="in" style="animation-delay:500ms"><rect x="347.0" y="270" width="83" height="30" rx="15" fill="#ffffff" stroke="#e4e4e4"/><text x="388.3" y="290" text-anchor="middle" class="mono" font-size="13" fill="#6b6b6b">Actions</text></g>
<text x="556" y="292" text-anchor="end" class="sans in" style="animation-delay:560ms" font-size="22" fill="#6b6b6b">↗</text>

</svg>
